<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake news Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #06b6d4;
            --success: #10b981;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--darker);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(45deg, #0f172a, #1e293b, #334155);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating elements */
        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: floatAround 20s infinite linear;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border-radius: 50%;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            top: 60%;
            right: 20%;
            animation-delay: -10s;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--accent), var(--success));
            border-radius: 20px;
            bottom: 30%;
            left: 70%;
            animation-delay: -5s;
        }

        @keyframes floatAround {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(90deg); }
            50% { transform: translateY(10px) rotate(180deg); }
            75% { transform: translateY(-15px) rotate(270deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }

        /* Main container */
        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Form styling */
        .form-container {
            position: relative;
        }

        .input-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: var(--light);
            font-size: 1rem;
        }

        .label-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        input[type="url"], textarea {
            width: 100%;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--light);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            resize: none;
        }

        input[type="url"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        input[type="url"]::placeholder, textarea::placeholder {
            color: #64748b;
        }

        textarea {
            min-height: 140px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            line-height: 1.6;
        }

        /* OR divider */
        .divider {
            position: relative;
            text-align: center;
            margin: 2rem 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .divider span {
            background: var(--darker);
            padding: 0 1.5rem;
            color: #64748b;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 1.75rem 2rem;
            background: linear-gradient(135deg, 
                rgba(99, 102, 241, 0.95), 
                rgba(168, 85, 247, 0.95),
                rgba(6, 182, 212, 0.95),
                rgba(16, 185, 129, 0.95)
            );
            background-size: 400% 400%;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            margin-top: 2rem;
            box-shadow: 
                0 20px 40px rgba(99, 102, 241, 0.4),
                0 10px 20px rgba(0, 0, 0, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            animation: submitGlow 4s ease-in-out infinite;
        }

        @keyframes submitGlow {
            0%, 100% { 
                box-shadow: 
                    0 20px 40px rgba(99, 102, 241, 0.4),
                    0 10px 20px rgba(0, 0, 0, 0.2),
                    inset 0 2px 0 rgba(255, 255, 255, 0.3),
                    inset 0 -2px 0 rgba(0, 0, 0, 0.1),
                    0 0 30px rgba(99, 102, 241, 0.5);
            }
            25% { 
                box-shadow: 
                    0 25px 50px rgba(168, 85, 247, 0.5),
                    0 15px 30px rgba(0, 0, 0, 0.3),
                    inset 0 2px 0 rgba(255, 255, 255, 0.4),
                    inset 0 -2px 0 rgba(0, 0, 0, 0.1),
                    0 0 40px rgba(168, 85, 247, 0.6);
            }
            50% { 
                box-shadow: 
                    0 30px 60px rgba(6, 182, 212, 0.6),
                    0 20px 40px rgba(0, 0, 0, 0.4),
                    inset 0 2px 0 rgba(255, 255, 255, 0.4),
                    inset 0 -2px 0 rgba(0, 0, 0, 0.1),
                    0 0 50px rgba(6, 182, 212, 0.7);
            }
            75% { 
                box-shadow: 
                    0 25px 50px rgba(16, 185, 129, 0.5),
                    0 15px 30px rgba(0, 0, 0, 0.3),
                    inset 0 2px 0 rgba(255, 255, 255, 0.4),
                    inset 0 -2px 0 rgba(0, 0, 0, 0.1),
                    0 0 40px rgba(16, 185, 129, 0.6);
            }
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: left 0.8s ease;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 22px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.15), 
                transparent,
                rgba(255, 255, 255, 0.08)
            );
            z-index: -1;
        }

        .submit-btn:hover {
            transform: translateY(-6px) scale(1.02);
            background-position: 100% 100%;
            animation: gradientFlow 2s ease infinite, buttonWave 1.2s ease infinite;
            box-shadow: 
                0 35px 70px rgba(99, 102, 241, 0.6),
                0 20px 40px rgba(168, 85, 247, 0.4),
                inset 0 3px 0 rgba(255, 255, 255, 0.5),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                0 0 80px rgba(6, 182, 212, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes buttonWave {
            0%, 100% { transform: translateY(-6px) scale(1.02); }
            50% { transform: translateY(-8px) scale(1.03); }
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-3px) scale(0.99);
            transition: all 0.1s ease;
        }

        /* Enhanced Loading state */
        .loading {
            pointer-events: none;
            opacity: 0.9;
            animation: loadingPulse 1.5s ease-in-out infinite;
            background: linear-gradient(135deg, 
                rgba(99, 102, 241, 0.8), 
                rgba(168, 85, 247, 0.8)
            );
        }

        @keyframes loadingPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            }
            50% { 
                transform: scale(1.01);
                box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
            }
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            margin: -16px 0 0 -16px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .submit-btn .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover .btn-text {
            letter-spacing: 1.5px;
        }

        .loading .btn-text {
            opacity: 0;
        }

        .btn-text span:first-child {
            font-size: 1.4rem;
            animation: iconFloat 2s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .submit-btn:hover .btn-text span:first-child {
            animation: iconRocket 0.8s ease-in-out;
        }

        @keyframes iconRocket {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(15deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* Feature highlights */
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* Input interaction effects */
        .input-inactive {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                padding: 2rem;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .features {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1> Analyze Article</h1>
            <p>Advanced ML analysis to detect misinformation</p>
        </div>

        <form action="/predict" method="post" class="form-container">
            <div class="input-group">
                <label class="input-label">
                    <div class="label-icon">🔗</div>
                    Article URL
                </label>
                <input type="url" id="url" name="url" placeholder="https://example.com/news-article">
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="input-group">
                <label class="input-label">
                    <div class="label-icon">📝</div>
                    Paste Article Text
                </label>
                <textarea id="text" name="text" placeholder="Paste the full article content here for analysis..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-text"> Analyze Article</span>
            </button>
        </form>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const urlInput = document.getElementById('url');
            const textInput = document.getElementById('text');
            const submitBtn = document.querySelector('.submit-btn');
            const btnText = document.querySelector('.btn-text');

            // Form validation and submission
            form.addEventListener('submit', function(e) {
                const url = urlInput.value.trim();
                const text = textInput.value.trim();
                
                if (!url && !text) {
                    e.preventDefault();
                    showError('Please provide either an article URL or paste the article text.');
                    return;
                }

                // Add loading state
                submitBtn.classList.add('loading');
                btnText.textContent = 'Analyzing...';
                submitBtn.disabled = true;

                // Reset after timeout
                setTimeout(() => {
                    submitBtn.classList.remove('loading');
                    btnText.textContent = '🚀 Analyze Article';
                    submitBtn.disabled = false;
                }, 15000);
            });

            // Input interaction effects
            urlInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    textInput.parentElement.classList.add('input-inactive');
                } else {
                    textInput.parentElement.classList.remove('input-inactive');
                }
            });

            textInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    urlInput.parentElement.classList.add('input-inactive');
                } else {
                    urlInput.parentElement.classList.remove('input-inactive');
                }
            });

            // Error handling
            function showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = `
                    position: fixed;
                    top: 2rem;
                    right: 2rem;
                    background: linear-gradient(45deg, #ef4444, #dc2626);
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 12px;
                    font-weight: 600;
                    box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
                    z-index: 1000;
                    animation: slideInRight 0.3s ease-out;
                `;
                errorDiv.textContent = message;
                document.body.appendChild(errorDiv);

                setTimeout(() => {
                    errorDiv.style.animation = 'slideOutRight 0.3s ease-out';
                    setTimeout(() => errorDiv.remove(), 300);
                }, 4000);
            }

            // Add CSS for error animations
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOutRight {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
